<!DOCTYPE html>
<html lang="en">
<head>
    <title>Shopee Sign Up</title> 
</head>
<body>

    <div class="phone-container">
        <div class="header">
            <i class="fa-solid fa-arrow-left back-btn"></i>
            <div class="title">Sign Up</div>
            <i class="fa-regular fa-circle-question help-btn"></i>
        </div>

        <div class="content">
            <div class="logo-container">
                <div class="shopee-logo">
                <img height="90 width=150"src="shopee.jpg">
        </div>
                <div class="voucher-badge">
                    <i class="fa-solid fa-percent"></i> Sign up get free shipping voucher
                </div>
            </div>

            <div class="form-group">
                <i class="fa-solid fa-phone-flip"></i>
                <input type="tel" placeholder="Phone Number" id="phoneInput">
            </div>

            <button class="btn-next" disabled>Next</button>

            <div class="divider">OR</div>

            <div class="social-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                <span>Sign Up with Google</span>
            </div>

            <div class="social-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" alt="Facebook">
                <span>Sign Up with Facebook</span>
            </div>

            <div class="terms-text">
                By signing up, you agree to Shopee's <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>
            </div>

            <div class="footer-links">
                Already have an account? <a href="index.html">Login</a>
            </div>
        </div>

        
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Phone frame container to mimic the screenshot layout */
        .phone-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        /* Header Styles */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background-color: #ffffff;
        }

        .header .back-btn {
            font-size: 24px;
            color: #ee4d2d;
            cursor: pointer;
        }

        .header .title {
            font-size: 20px;
            color: #222222;
            font-weight: 400;
            flex-grow: 1;
            margin-left: 20px;
        }

        .header .help-btn {
            font-size: 20px;
            color: #ee4d2d;
            cursor: pointer;
        }

        /* Main Content area */
        .content {
            padding: 0 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        /* Logo and Voucher Badge */
        .logo-container {
            margin-top: 40px;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Reconstructed Shopee Bag Logo */
        .shopee-logo {
            width: 65px;
            height: 70px;
            background-color: #ee4d2d;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
        }

        .shopee-logo::before {
            content: '';
            position: absolute;
            top: -15px;
            width: 34px;
            height: 30px;
            border: 4px solid #ee4d2d;
            border-bottom: none;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: -1;
        }

        .shopee-logo span {
            color: white;
            font-size: 38px;
            font-weight: 700;
            font-family: 'Roboto', sans-serif;
            transform: translateY(2px);
        }

        .voucher-badge {
            background-color: #fff1ee;
            color: #ff5722;
            padding: 4px 10px;
            border-radius: 2px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* Form Controls */
        .form-group {
            width: 100%;
            position: relative;
            margin-top: 35px;
        }

        .form-group i {
            position: absolute;
            left: 5px;
            bottom: 12px;
            color: #757575;
            font-size: 18px;
        }

        .form-group input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 10px 10px 35px;
            font-size: 16px;
            outline: none;
            color: #222;
        }

        .form-group input::placeholder {
            color: #cccccc;
        }

        .form-group input:focus {
            border-bottom-color: #ee4d2d;
        }

        .btn-next {
            width: 100%;
            background-color: #e8e8e8;
            color: #bcbcbc;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-size: 16px;
            margin-top: 25px;
            cursor: not-allowed;
            font-weight: 400;
        }

        /* Divider */
        .divider {
            width: 100%;
            display: flex;
            align-items: center;
            text-align: center;
            color: #ccc;
            font-size: 12px;
            margin: 35px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;
        }

        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        /* Social Buttons */
        .social-btn {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 15px;
            color: #222222;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .social-btn img {
            width: 22px;
            height: 22px;
        }

        /* Terms text */
        .terms-text {
            font-size: 11px;
            color: #888888;
            text-align: center;
            line-height: 1.5;
            margin-top: 15px;
            padding: 0 10px;
        }

        .terms-text a {
            color: #555555;
            text-decoration: none;
        }

        /* Footer links */
        .footer-links {
            margin-top: auto;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #555555;
            padding-bottom: 25px;
        }

        .footer-links a {
            color: #2673dd;
            text-decoration: none;
        }

        /* Fingerprint Authentication row */
        .fingerprint-row {
            width: 100%;
            border-top: 1px solid #f0f0f0;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
        }

        .fingerprint-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #555555;
        }

        .fingerprint-left i.fa-fingerprint {
            font-size: 20px;
            color: #757575;
        }

        .fingerprint-left i.fa-circle-question {
            font-size: 14px;
            color: #ccc;
            cursor: pointer;
        }

        /* Toggle Switch UI */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2ecc71; /* Match the active green color */
        }

        input:checked + .slider::before {
            transform: translateX(20px);
        }
    </style>

</body>
</html>
